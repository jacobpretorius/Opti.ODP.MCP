name: Publish Docker image

# Runs only when commits land on main (a merged pull request or a direct push). Pull requests never trigger it.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# A newer push to main cancels an in-flight build, so `latest` always ends up on the newest commit.
concurrency:
  group: publish-image
  cancel-in-progress: true

# Same name as the repo; metadata-action lowercases it (GHCR requires lowercase): ghcr.io/jacobpretorius/opti.odp.mcp
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner also build the arm64 image (Apple Silicon, ARM servers).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
